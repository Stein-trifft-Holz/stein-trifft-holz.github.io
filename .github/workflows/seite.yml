# Baut die Seite bei jeder Änderung (auch aus Pages CMS) und jede Nacht neu,
# damit vergangene Termine und abgelaufene Pausen von selbst verschwinden.
name: Seite bauen
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bauen:
    # Sperre bis zur Freigabe durch Katja (S12/S13): Erst wenn die Repository-Variable
    # VEROEFFENTLICHEN auf "ja" steht, wird gebaut und veröffentlicht.
    if: vars.VEROEFFENTLICHEN == 'ja'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: TZ=Europe/Berlin python bauen.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
